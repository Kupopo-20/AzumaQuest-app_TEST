<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>うんえい かんり（あずま保育園クエスト）</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ============ ログイン ============ -->
<section id="login-view" class="login">
  <h1>うんえい かんり</h1>
  <p class="login-note">運営メンバー専用の画面です。</p>
  <form id="login-form" autocomplete="on">
    <label>メールアドレス
      <input id="login-email" type="email" autocomplete="username" required>
    </label>
    <label>パスワード
      <input id="login-password" type="password" autocomplete="current-password" required>
    </label>
    <button id="login-button" type="submit" class="btn btn-main">ログイン</button>
    <p id="login-message" class="message" role="alert"></p>
  </form>
</section>

<!-- ============ 管理画面 ============ -->
<div id="main-view" hidden>
  <header class="topbar">
    <h1>みまもり（あずま保育園クエスト）</h1>
    <div class="topbar-actions">
      <span id="updated-at" class="updated-at">-</span>
      <button id="btn-refresh" class="btn">いま 更新</button>
      <button id="btn-csv" class="btn">CSVを保存</button>
      <button id="btn-logout" class="btn">ログアウト</button>
    </div>
  </header>

  <section class="summary" aria-label="まとめ">
    <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">さんかしゃ</span></div>
    <div class="stat"><span class="stat-num" id="stat-active">0</span><span class="stat-label">いま あそんでいる<small>（10分いない）</small></span></div>
    <div class="stat"><span class="stat-num" id="stat-boss">0</span><span class="stat-label">まおうを たおした</span></div>
    <div class="stat"><span class="stat-num" id="stat-ending">0</span><span class="stat-label">エンディング</span></div>
    <div class="stat"><span class="stat-num" id="stat-avg">0</span><span class="stat-label">へいきん レベル</span></div>
    <div class="stat stat-warn"><span class="stat-num" id="stat-idle">0</span><span class="stat-label">30分いじょう うごいていない<small>（クリア前）</small></span></div>
  </section>

  <section class="controls">
    <input id="search" type="search" placeholder="なまえで さがす" aria-label="なまえで さがす">
    <select id="sort" aria-label="ならびかえ">
      <option value="seen">さいきん うごいた じゅん</option>
      <option value="level">レベルが たかい じゅん</option>
      <option value="levelAsc">レベルが ひくい じゅん</option>
      <option value="name">なまえ じゅん</option>
      <option value="created">はじめた じゅん</option>
    </select>
    <select id="filter" aria-label="しぼりこみ">
      <option value="all">ぜんいん</option>
      <option value="active">いま あそんでいる</option>
      <option value="idle">30分いじょう うごいていない（クリア前）</option>
      <option value="boss">まおうを たおした</option>
      <option value="notclear">まだ クリアしていない</option>
    </select>
  </section>

  <p id="list-message" class="message"></p>
  <div id="list" class="list"></div>

  <section class="danger-zone">
    <h2>イベントのあと</h2>
    <p>さんかしゃの データを、ぜんぶ 消します（もとにもどせません）。</p>
    <button id="btn-delete-all" class="btn btn-danger">データを ぜんぶ 消す</button>
  </section>
</div>

<script src="lib/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
